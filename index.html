<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A modern notes management app — create, search, pin, color and organize your notes.">
  <title>My Notes</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'%3E%3Cpath d='M4 4a2 2 0 0 1 2-2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <a class="brand" href="index.html">
      <span class="brand-logo">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="M17 3h4v4M8 13l9-9"/>
        </svg>
      </span>
      <h1>My Notes</h1>
    </a>
    <div class="nav-actions">
      <button class="icon-btn" type="button" data-action="toggle-theme" title="Toggle dark / light mode" aria-label="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
      <a class="btn" href="create.html">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        New Note
      </a>
    </div>
  </header>

  <main class="container">
    <div class="page-header">
      <div>
        <h2>All Notes</h2>
        <p class="subtitle" id="notesSubtitle">Loading your notes…</p>
      </div>
    </div>

    <section class="stats-bar" id="statsBar" aria-label="Notes statistics">
      <div class="stat-card">
        <span class="stat-icon total">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
        </span>
        <div>
          <div class="stat-value" id="statTotal">—</div>
          <div class="stat-label">Total Notes</div>
        </div>
      </div>
      <div class="stat-card">
        <span class="stat-icon pin">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M16 3a1 1 0 0 1 .7.3l4 4a1 1 0 0 1-.3 1.63l-3.6 1.8-2.2 5.9a1 1 0 0 1-1.63.32L9 13.4l-5 5L3 19l5-5-3.55-3.97a1 1 0 0 1 .32-1.64L10.7 6.2l1.8-3.6A1 1 0 0 1 16 3z"/></svg>
        </span>
        <div>
          <div class="stat-value" id="statPinned">—</div>
          <div class="stat-label">Pinned</div>
        </div>
      </div>
      <div class="stat-card">
        <span class="stat-icon tag">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.6 2.5 21.5 11.4a2 2 0 0 1 0 2.8l-7.3 7.3a2 2 0 0 1-2.8 0L2.5 12.6A2 2 0 0 1 2 11.2V4a2 2 0 0 1 2-2h7.2a2 2 0 0 1 1.4.5z"/><path d="M7 7h.01"/></svg>
        </span>
        <div>
          <div class="stat-value" id="statTags">—</div>
          <div class="stat-label">Unique Tags</div>
        </div>
      </div>
    </section>

    <div class="toolbar">
      <div class="search-wrap" id="searchWrap">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-3.5-3.5"/></svg>
        <input id="searchInput" class="search" type="text" placeholder="Search by title or content…" aria-label="Search notes">
        <button class="search-clear" type="button" id="searchClear" aria-label="Clear search">✕</button>
      </div>
      <select class="sort-select" id="sortSelect" aria-label="Sort notes">
        <option value="updatedAt-desc">Recently updated</option>
        <option value="createdAt-desc">Newest first</option>
        <option value="createdAt-asc">Oldest first</option>
        <option value="title-asc">Title A → Z</option>
        <option value="title-desc">Title Z → A</option>
      </select>
    </div>

    <div class="tag-filter-bar" id="tagFilterBar" hidden></div>

    <div id="notesContainer" class="notes-grid" aria-live="polite"></div>
  </main>

  <footer class="site-footer">
    <p>My Notes — built with Node.js, Express &amp; vanilla JavaScript</p>
  </footer>

  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
