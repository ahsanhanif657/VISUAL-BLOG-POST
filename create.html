<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Note — My Notes</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'%3E%3Cpath d='M4 4a2 2 0 0 1 2-2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <a class="brand" href="index.html">
      <span class="brand-logo">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="M17 3h4v4M8 13l9-9"/>
        </svg>
      </span>
      <h1>My Notes</h1>
    </a>
    <div class="nav-actions">
      <button class="icon-btn" type="button" data-action="toggle-theme" title="Toggle dark / light mode" aria-label="Toggle dark mode">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="form-container">
    <a class="back-link" href="index.html">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      Back to Notes
    </a>

    <div class="form-card">
      <h1>Create New Note</h1>

      <div class="form-error" id="formError" role="alert"></div>

      <form id="noteForm" novalidate>
        <div class="field">
          <label for="title">Title</label>
          <input id="title" type="text" placeholder="e.g. Meeting Notes" maxlength="120" required>
        </div>

        <div class="field">
          <label for="content">Content <span class="char-count" id="contentCount">0 characters</span></label>
          <textarea id="content" placeholder="Write your note…" required></textarea>
        </div>

        <div class="field">
          <label for="tags">Tags</label>
          <input id="tags" type="text" placeholder="work, ideas, todo…">
          <p class="field-hint">Separate tags with commas. Tags help you filter notes on the home page.</p>
        </div>

        <div class="field">
          <label>Card color</label>
          <div class="color-row" id="colorRow"></div>
        </div>

        <div class="field">
          <label class="pin-toggle" for="pinned">
            <input id="pinned" type="checkbox">
            Pin this note to the top
          </label>
        </div>

        <div class="form-actions">
          <a class="btn btn-ghost" href="index.html">Cancel</a>
          <button class="btn" type="submit" id="saveBtn">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
            Save Note
          </button>
        </div>
      </form>
    </div>
  </main>

  <script src="js/ui.js"></script>
  <script src="js/create.js"></script>
</body>
</html>
